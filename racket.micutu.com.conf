# =============================================================================
# Deployed copy lives at /etc/nginx/sites-available/racket.micutu.com.conf
# (symlinked/copied into sites-enabled). This is the hardened target config.
#
# Requires (already present on this host):
#   * conf.d/cloudflare-origin-guard.conf  -> defines $from_cloudflare_origin
#   * conf.d/racket-rate-limit.conf        -> defines the racket_render zone
#     (ship racket-rate-limit.conf from this repo alongside this file)
#   * snippets/robots.conf, snippets/block-dotfiles.conf
#   * Certbot-managed TLS material for racket.micutu.com
#
# Changes vs. the previous config:
#   - Only accept traffic coming through Cloudflare (origin-IP lockdown).
#   - Per-IP rate limit on the render endpoint (DoS throttle).
#   - client_max_body_size caps uploads at the edge (the real gate; the app's
#     3 MB check is secondary because web-server buffers the body first).
#   - Explicit CSP that also allows the injected Umami analytics script
#     (the shared security-headers.conf CSP would otherwise block it).
#   - block-dotfiles snippet.
# =============================================================================

server {
    include snippets/block-dotfiles.conf;
    server_name racket.micutu.com;

    # Reject anything that didn't arrive via Cloudflare (direct-to-origin).
    if ($from_cloudflare_origin = 0) { return 403; }

    # Uploads (image -> DSL) are small; the app caps at 3 MB, cap here too.
    client_max_body_size 4m;

    location / {
        # Throttle render/preview/upload floods per client IP.
        limit_req zone=racket_render burst=20 nodelay;

        proxy_pass http://127.0.0.1:8345;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers (explicit, because adding any add_header in a block
    # discards inherited ones). CSP allows our inline style/script and Umami.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.micutu.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://analytics.micutu.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    include snippets/robots.conf;

    # Umami analytics injection.
    sub_filter '</head>' '    <script defer src="https://analytics.micutu.com/script.js" data-website-id="1a3d9f96-704b-47e1-a1cb-0c21d03e1d65"></script></head>';
    sub_filter_once on;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/racket.micutu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/racket.micutu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = racket.micutu.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name racket.micutu.com;
    return 404; # managed by Certbot
}
