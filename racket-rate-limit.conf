# Deploy to /etc/nginx/conf.d/racket-rate-limit.conf
# limit_req_zone must live in the http context, so it cannot go inside the
# vhost's server{} block. 60 requests/minute per IP is comfortable for a human
# clicking Render/examples while stopping automated floods; burst is set in the
# vhost's location (burst=20 nodelay).
limit_req_zone $binary_remote_addr zone=racket_render:10m rate=60r/m;
